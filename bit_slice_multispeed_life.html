<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bit-Slice Multi-Speed Life</title>
  <style>
    :root{color-scheme:dark;--bg:#080b0d;--panel:#12181c;--panel2:#1c252b;--line:#33424b;--text:#eef5f7;--muted:#9dafb8;--accent:#79d9ff;--gold:#ffd166;--danger:#ff7a7a}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto 1fr;overflow:hidden}header{border-bottom:1px solid var(--line);background:#101519;padding:10px 14px;display:flex;justify-content:space-between;gap:14px;align-items:center}h1{margin:0;font-size:18px}.stats{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 14px;color:var(--muted);font-size:13px}.stats strong{color:var(--text)}main{min-height:0;display:grid;grid-template-columns:minmax(300px,390px) 1fr}aside{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:12px}.stage{min-width:0;min-height:0;display:grid;place-items:center;padding:12px;background:#030405}canvas{display:block;width:min(100%,calc((100vh - 86px)*1.333));max-height:calc(100vh - 86px);aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;border:1px solid #303c44;background:#000;cursor:crosshair}section{border:1px solid var(--line);border-radius:8px;background:#10161a;padding:11px;margin-bottom:11px}h2{margin:0 0 9px;font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}label{color:var(--muted);font-size:13px}input,button,select{font:inherit}input[type=number],input[type=text],select{width:112px;border:1px solid var(--line);border-radius:6px;padding:6px 7px;background:#0a0e11;color:var(--text)}input.wide,select.wide{width:190px}input[type=range]{width:155px;accent-color:var(--accent)}input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}button{border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:34px;background:var(--panel2);color:var(--text);cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:#123447;border-color:#23627f}button.warn{background:#351c1c;border-color:#743737;color:#ffe6e6}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:9px;margin:8px 0}.check{display:flex;align-items:center;gap:8px;margin:8px 0}.readout{border:1px solid var(--line);border-radius:6px;background:#0a0e11;color:var(--gold);min-height:42px;padding:8px;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.hint{color:var(--muted);font-size:12px;line-height:1.4;margin:7px 0 0}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.swatch{min-height:34px;padding:0;position:relative;overflow:hidden}.swatch::before{content:"";position:absolute;inset:5px;border-radius:4px;background:var(--swatch);border:1px solid rgba(255,255,255,.25)}.swatch.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}@media(max-width:880px){body{overflow:auto}main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:48vh}canvas{width:100%;max-height:50vh}}
  </style>
</head>
<body>
<header><h1>Bit-Slice Multi-Speed Life</h1><div class="stats"><span>Gen <strong id="genOut">0</strong></span><span>Live pixels <strong id="liveOut">0</strong></span><span>Live bits <strong id="bitsOut">0</strong></span><span>Active lanes <strong id="lanesOut">0</strong></span><span>Updated <strong id="updatedOut">0</strong></span></div></header>
<main><aside>
<section><h2>Run</h2><div class="grid2"><button id="playPause" class="primary">Play</button><button id="step">Step</button><button id="resetClock">Reset Clocks</button><button id="clear" class="warn">Clear</button></div><div class="row"><label for="speed">Frames / sec</label><input id="speed" type="range" min="1" max="90" value="18"></div><div class="row"><label for="gridW">Width</label><input id="gridW" type="number" min="32" max="512" value="160"></div><div class="row"><label for="gridH">Height</label><input id="gridH" type="number" min="24" max="384" value="120"></div><button id="resizeWorld">Apply Size</button></section>
<section><h2>Clocked Bit Slices</h2><div class="row"><label for="sliceMode">Slice mode</label><select id="sliceMode" class="wide"><option value="byte" selected>RGB bytes: B fast, G medium, R slow</option><option value="bits">individual bit lanes</option><option value="windows">moving bit windows</option><option value="full">all bits together</option></select></div><div class="row"><label for="clockMode">Clock mode</label><select id="clockMode" class="wide"><option value="periods" selected>per-slice periods</option><option value="all">all slices every generation</option><option value="one">one slice per generation</option></select></div><div class="row"><label for="periods">Periods</label><input id="periods" class="wide" type="text" value="1,2,4"></div><div class="row"><label for="phases">Phases</label><input id="phases" class="wide" type="text" value="0,0,0"></div><div class="row"><label for="bitsPerSlice">Bits / window</label><input id="bitsPerSlice" type="number" min="-24" max="24" value="-8"></div><div class="row"><label for="sliceAdvance">Window advance</label><input id="sliceAdvance" type="number" min="-24" max="24" value="-3"></div><div class="row"><label for="activeWindows">Active windows</label><input id="activeWindows" type="number" min="1" max="24" value="3"></div><label class="check"><input id="preserveInactive" type="checkbox" checked> Preserve inactive slices</label><div class="readout" id="sliceOut"></div><p class="hint">This restores the old behavior: multiple Life automata run on the same RGB grid at different speeds.</p></section>
<section><h2>Neighborhood</h2><div class="row"><label for="neighborhoodMode">Mode</label><select id="neighborhoodMode" class="wide"><option value="moore" selected>classic Moore 8</option><option value="rotated">rotated/scaled 8</option></select></div><div class="row"><label for="radius">Radius</label><input id="radius" type="number" min="1" max="32" value="1"></div><div class="row"><label for="angle">Angle degrees</label><input id="angle" type="number" min="-360" max="360" value="0"></div><div class="row"><label for="angleAdvance">Angle advance</label><input id="angleAdvance" type="number" min="-90" max="90" value="0"></div><div class="readout" id="neighborOut"></div></section>
<section><h2>Rules</h2><div class="row"><label for="birthRule">Birth counts</label><input id="birthRule" type="text" value="3"></div><div class="row"><label for="survivalRule">Survival counts</label><input id="survivalRule" type="text" value="2,3"></div><label class="check"><input id="crossSliceColor" type="checkbox"> Use neighboring visible colors for births</label><div class="row"><label for="birthColorMode">Birth color</label><select id="birthColorMode" class="wide"><option value="slice" selected>slice-only</option><option value="or">OR neighbor colors</option><option value="rare">rare/XOR mix</option><option value="majority">majority color</option></select></div></section>
<section><h2>Seeds</h2><div class="grid2"><button id="gliders">Multi-Speed Gliders</button><button id="blinkers">Multi-Speed Blinkers</button><button id="random">Random White</button><button id="randomColor">Random Color</button></div><div class="row"><label for="density">Density %</label><input id="density" type="number" min="1" max="100" value="18"></div></section>
<section><h2>Paint</h2><div class="swatches" id="swatches"></div><div class="row"><label for="brush">Brush radius</label><input id="brush" type="number" min="0" max="12" value="0"></div><p class="hint">Left-click paints. Shift-left or right-click erases.</p></section>
</aside><div class="stage"><canvas id="life" width="160" height="120"></canvas></div></main>
<script>
const FULL=0xFFFFFF;let W=160,H=120;let grid=new Uint32Array(W*H),next=new Uint32Array(W*H);let running=false,generation=0,lastFrame=0,currentAngle=0,paintValue=FULL;const canvas=document.getElementById('life'),ctx=canvas.getContext('2d',{alpha:false});let image=ctx.createImageData(W,H);const $=id=>document.getElementById(id);const el={playPause:$('playPause'),step:$('step'),resetClock:$('resetClock'),clear:$('clear'),speed:$('speed'),gridW:$('gridW'),gridH:$('gridH'),resizeWorld:$('resizeWorld'),sliceMode:$('sliceMode'),clockMode:$('clockMode'),periods:$('periods'),phases:$('phases'),bitsPerSlice:$('bitsPerSlice'),sliceAdvance:$('sliceAdvance'),activeWindows:$('activeWindows'),preserveInactive:$('preserveInactive'),sliceOut:$('sliceOut'),neighborhoodMode:$('neighborhoodMode'),radius:$('radius'),angle:$('angle'),angleAdvance:$('angleAdvance'),neighborOut:$('neighborOut'),birthRule:$('birthRule'),survivalRule:$('survivalRule'),crossSliceColor:$('crossSliceColor'),birthColorMode:$('birthColorMode'),gliders:$('gliders'),blinkers:$('blinkers'),random:$('random'),randomColor:$('randomColor'),density:$('density'),swatches:$('swatches'),brush:$('brush'),genOut:$('genOut'),liveOut:$('liveOut'),bitsOut:$('bitsOut'),lanesOut:$('lanesOut'),updatedOut:$('updatedOut')};
const swatches=[['White',0xFFFFFF],['Red',0xFF0000],['Green',0x00FF00],['Blue',0x0000FF],['Yellow',0xFFFF00],['Cyan',0x00FFFF],['Magenta',0xFF00FF],['Black',0x000000]];
function mod(n,m){return((n%m)+m)%m}function idx(x,y){return mod(y,H)*W+mod(x,W)}function clamp(n,lo,hi){return Math.max(lo,Math.min(hi,n))}function intVal(input,fallback,lo=-Infinity,hi=Infinity){let v=Math.round(Number(input.value));if(!Number.isFinite(v))v=fallback;v=clamp(v,lo,hi);input.value=v;return v}function parseList(text,fallback){const nums=String(text).split(/[^-0-9]+/).filter(Boolean).map(Number).filter(Number.isFinite);return nums.length?nums:fallback}function parseRule(text,fallback){const nums=String(text).split(/[^0-9]+/).filter(Boolean).map(Number).filter(n=>Number.isInteger(n)&&n>=0);return new Set(nums.length?nums:fallback)}function bitCount24(value){value&=FULL;value=value-((value>>>1)&0x555555);value=(value&0x333333)+((value>>>2)&0x333333);return ((((value+(value>>>4))&0x0F0F0F)*0x010101)>>>16)&0xFF}function hex(value){return '#'+(value>>>0).toString(16).padStart(6,'0')}
function maskFromBits(start,width){let mask=0;let count=Math.abs(width||1);count=clamp(count,1,24);const dir=width<0?-1:1;for(let i=0;i<count;i++)mask|=(1<<mod(start+i*dir,24))>>>0;return mask&FULL}
function stateSlices(){const mode=el.sliceMode.value;const periods=parseList(el.periods.value,[1,2,4]).map(v=>Math.max(1,Math.abs(Math.round(v))));const phases=parseList(el.phases.value,[0,0,0]).map(v=>Math.round(v));let slices=[];if(mode==='full'){slices=[{label:'full',mask:FULL,index:0}]}else if(mode==='byte'){slices=[{label:'B byte',mask:0x0000FF,index:0},{label:'G byte',mask:0x00FF00,index:1},{label:'R byte',mask:0xFF0000,index:2}]}else if(mode==='bits'){for(let bit=0;bit<24;bit++)slices.push({label:'bit '+bit,mask:(1<<bit)>>>0,index:bit})}else{const width=intVal(el.bitsPerSlice,-8,-24,24)||-8;const advance=intVal(el.sliceAdvance,-3,-24,24)||-3;const count=intVal(el.activeWindows,3,1,24);const seen=new Set();for(let i=0;i<count;i++){const start=mod(i*advance+generation*advance,24);const mask=maskFromBits(start,width);if(!seen.has(mask)){seen.add(mask);slices.push({label:`win ${start}`,mask,index:i})}}}for(const s of slices){s.period=periods[s.index%periods.length]||1;s.phase=phases[s.index%phases.length]||0;if(el.clockMode.value==='all')s.active=true;else if(el.clockMode.value==='one')s.active=(generation%Math.max(1,slices.length))===s.index;else s.active=((generation+s.phase)%s.period)===0}const processedMask=slices.filter(s=>s.active).reduce((m,s)=>m|s.mask,0)&FULL;const allMask=slices.reduce((m,s)=>m|s.mask,0)&FULL;el.sliceOut.textContent=slices.map(s=>`${s.active?'*':'.'}${s.label}:${s.mask.toString(16).padStart(6,'0')}/p${s.period}`).join('  ');return{slices,processedMask,allMask}}
function neighborOffsets(){if(el.neighborhoodMode.value==='moore'){const r=intVal(el.radius,1,1,32);const offsets=[[-r,-r],[0,-r],[r,-r],[-r,0],[r,0],[-r,r],[0,r],[r,r]];el.neighborOut.textContent=offsets.map(o=>`[${o[0]},${o[1]}]`).join(' ');return offsets}const r=intVal(el.radius,1,1,32);const angleDeg=Number(el.angle.value)+currentAngle;const angle=angleDeg*Math.PI/180;const dirs=[];for(let i=0;i<4;i++)dirs.push(angle+i*Math.PI/2);const seen=new Set(),offsets=[];function add(dx,dy){dx=Math.round(dx);dy=Math.round(dy);const key=dx+','+dy;if((dx||dy)&&!seen.has(key)){seen.add(key);offsets.push([dx,dy])}}const prim=dirs.map(a=>[Math.cos(a)*r,Math.sin(a)*r]);for(const p of prim)add(p[0],p[1]);for(let i=0;i<4;i++){const p=prim[i],q=prim[(i+1)%4];add(p[0]+q[0],p[1]+q[1])}el.neighborOut.textContent=`angle ${angleDeg.toFixed(1)}: `+offsets.map(o=>`[${o[0]},${o[1]}]`).join(' ');return offsets}
function chooseBirthColor(neighborColors,fallbackMask){const list=neighborColors.filter(v=>v!==0);if(!list.length)return fallbackMask||FULL;if(el.birthColorMode.value==='or')return list.reduce((a,b)=>a|b,0)&FULL;if(el.birthColorMode.value==='majority'){const counts=new Map();for(const c of list)counts.set(c,(counts.get(c)||0)+1);let best=list[0],bestCount=0;for(const[c,n]of counts)if(n>bestCount){best=c;bestCount=n}return best&FULL}if(el.birthColorMode.value==='rare'){const counts=new Map();for(const c of list)counts.set(c,(counts.get(c)||0)+1);const min=Math.min(...counts.values());return[...counts.entries()].filter(([,n])=>n===min).map(([c])=>c).reduce((a,b)=>a^b,0)||(list.reduce((a,b)=>a|b,0)&FULL)}return fallbackMask}
function stepLife(){const birthRule=parseRule(el.birthRule.value,[3]);const survivalRule=parseRule(el.survivalRule.value,[2,3]);const offsets=neighborOffsets();const{slices,allMask}=stateSlices();if(el.preserveInactive.checked)next.set(grid);else{for(let i=0;i<grid.length;i++)next[i]=grid[i]&(~allMask&FULL)}let updated=0;for(const slice of slices){if(!slice.active)continue;const mask=slice.mask&FULL;updated++;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=idx(x,y),self=grid[i],alive=(self&mask)!==0;let neighbors=0;const mateColors=[];for(const[dx,dy]of offsets){const v=grid[idx(x+dx,y+dy)];if((v&mask)!==0)neighbors++;if(el.crossSliceColor.checked&&v)mateColors.push(v);else if(v&mask)mateColors.push(v&mask)}let out=0;if(!alive&&birthRule.has(neighbors)){out=chooseBirthColor(mateColors,mask)&mask;if(!out)out=mask}else if(alive&&survivalRule.has(neighbors)){out=self&mask}next[i]=((next[i]&~mask)|out)&FULL}}[grid,next]=[next,grid];generation++;currentAngle=(currentAngle+Number(el.angleAdvance.value||0))%360;render(updated)}
function render(updated=0){let live=0,bits=0;const data=image.data;for(let i=0;i<grid.length;i++){const v=grid[i]&FULL;if(v)live++;bits+=bitCount24(v);const p=i*4;data[p]=(v>>16)&255;data[p+1]=(v>>8)&255;data[p+2]=v&255;data[p+3]=255}ctx.putImageData(image,0,0);const info=stateSlices();el.genOut.textContent=generation;el.liveOut.textContent=live;el.bitsOut.textContent=bits;el.lanesOut.textContent=info.slices.length;el.updatedOut.textContent=updated}
function clearWorld(){grid.fill(0);next.fill(0);generation=0;currentAngle=0;render()}function addGlider(cx,cy,color,dir='se'){const base=[[1,0],[2,1],[0,2],[1,2],[2,2]];const transforms={se:([x,y])=>[x,y],sw:([x,y])=>[2-x,y],ne:([x,y])=>[x,2-y],nw:([x,y])=>[2-x,2-y]};const t=transforms[dir]||transforms.se;for(const p of base.map(t))grid[idx(cx+p[0],cy+p[1])]=color}function seedGliders(){clearWorld();addGlider(12,12,0x0000FF,'se');addGlider(38,18,0x00FF00,'se');addGlider(66,24,0xFF0000,'se');addGlider(96,30,0xFFFFFF,'sw');addGlider(122,70,0x00FFFF,'nw');addGlider(28,86,0xFF00FF,'ne');render()}function seedBlinkers(){clearWorld();const seeds=[[20,20,0x0000FF],[40,20,0x00FF00],[60,20,0xFF0000],[80,20,0xFFFFFF],[100,20,0x00FFFF],[120,20,0xFF00FF]];for(const[x,y,c]of seeds){grid[idx(x-1,y)]=c;grid[idx(x,y)]=c;grid[idx(x+1,y)]=c}render()}function randomize(colorful){clearWorld();const density=clamp(Number(el.density.value)||18,1,100)/100;for(let i=0;i<grid.length;i++)if(Math.random()<density)grid[i]=colorful?((Math.floor(Math.random()*FULL)+1)&FULL):FULL;render()}function resizeWorld(){W=intVal(el.gridW,160,32,512);H=intVal(el.gridH,120,24,384);grid=new Uint32Array(W*H);next=new Uint32Array(W*H);canvas.width=W;canvas.height=H;image=ctx.createImageData(W,H);clearWorld()}function cellFromEvent(event){const rect=canvas.getBoundingClientRect();return[Math.floor((event.clientX-rect.left)*W/rect.width),Math.floor((event.clientY-rect.top)*H/rect.height)]}function paint(event){const[x,y]=cellFromEvent(event);const erase=event.shiftKey||event.buttons===2;const brush=intVal(el.brush,0,0,12);for(let yy=-brush;yy<=brush;yy++)for(let xx=-brush;xx<=brush;xx++){if(xx*xx+yy*yy>brush*brush)continue;grid[idx(x+xx,y+yy)]=erase?0:paintValue}render()}function tick(time){const target=1000/Number(el.speed.value);if(running&&time-lastFrame>=target){stepLife();lastFrame=time}requestAnimationFrame(tick)}function setRunning(v){running=v;el.playPause.textContent=running?'Pause':'Play'}function initSwatches(){for(const[name,value]of swatches){const b=document.createElement('button');b.className='swatch';b.title=name;b.style.setProperty('--swatch',hex(value));b.addEventListener('click',()=>{paintValue=value;for(const child of el.swatches.children)child.classList.remove('active');b.classList.add('active')});if(value===paintValue)b.classList.add('active');el.swatches.appendChild(b)}}
el.playPause.addEventListener('click',()=>setRunning(!running));el.step.addEventListener('click',()=>stepLife());el.resetClock.addEventListener('click',()=>{generation=0;currentAngle=0;render()});el.clear.addEventListener('click',clearWorld);el.resizeWorld.addEventListener('click',resizeWorld);el.gliders.addEventListener('click',seedGliders);el.blinkers.addEventListener('click',seedBlinkers);el.random.addEventListener('click',()=>randomize(false));el.randomColor.addEventListener('click',()=>randomize(true));canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);paint(e)});canvas.addEventListener('pointermove',e=>{if(e.buttons)paint(e)});for(const id of ['sliceMode','clockMode','periods','phases','bitsPerSlice','sliceAdvance','activeWindows','preserveInactive','neighborhoodMode','radius','angle','angleAdvance','birthRule','survivalRule','crossSliceColor','birthColorMode'])el[id].addEventListener('change',()=>render());initSwatches();seedGliders();requestAnimationFrame(tick);
</script>
</body>
</html>
